services:
  - type: web
    name: nayacura-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Presence/WebRTC signaling for the demo video room (see rooms-server/).
      - key: VITE_ROOM_API_URL
        fromService:
          type: web
          name: nayacura-rooms
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: nayacura-rooms
    runtime: node
    plan: free
    rootDir: rooms-server
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
